# Render Blueprint for the KAGE BFF (server/).
# Deploy via: Render Dashboard -> New -> Blueprint -> pick this repo.
# Secrets are marked `sync: false` so Render prompts for them instead of
# storing them in the repo.
services:
  - type: web
    name: kage-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    # --include=dev keeps tsx available even when NODE_ENV=production,
    # because the start command runs TypeScript directly via tsx.
    buildCommand: npm ci --include=dev
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Comma-separated CORS allowlist of your frontend origins, or "*".
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_PUBLIC_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY1
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_ANALYSIS_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
